<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAFFENG - Definition of Done</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Backgrounds */
            --TM-navy-deep: #0A1628;
            --TM-navy-medium: #112240;
            --TM-navy-light: #1A365D;
            
            /* Cores Primárias */
            --TM-neon-green: #64FFDA;
            --TM-cyan-vibrant: #00D4FF;
            
            /* Textos */
            --TM-text-primary: #E6F1FF;
            --TM-text-secondary: #8892B0;
            --TM-text-emphasis: #64FFDA;
            
            /* Status */
            --TM-status-pending: #00D4FF;
            --TM-status-progress: #64FFDA;
            --TM-status-complete: #64FFDA;
            --TM-warning: #FFA500;
            --TM-error: #FF6B6B;
            
            /* Componentes */
            --TM-border-subtle: rgba(100, 255, 218, 0.1);
            --TM-card-bg: rgba(17, 34, 64, 0.5);
            --TM-card-border: rgba(100, 255, 218, 0.1);
            --TM-input-bg: #0A1628;
            --TM-input-border: #1A365D;
            
            /* Tipografia */
            --font-heading: "Exo 2", sans-serif;
            --font-body: "Inter", sans-serif;
            --font-mono: "Roboto Mono", monospace;
            
            /* Gradientes */
            --TM-gradient-bg: linear-gradient(180deg, #0A1628 0%, #112240 50%, #0A1628 100%);
            --TM-gradient-login: linear-gradient(180deg, #0A1628 0%, #112240 50%, #1A365D 100%);
            
            /* Espaçamento */
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            --spacing-2xl: 48px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: var(--TM-gradient-bg);
            min-height: 100vh;
            padding: var(--spacing-lg);
            color: var(--TM-text-primary);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: var(--TM-navy-deep);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            border: 1px solid var(--TM-border-subtle);
            overflow: hidden;
        }

        .header {
            background: var(--TM-gradient-login);
            padding: var(--spacing-2xl);
            text-align: center;
            border-bottom: 2px solid var(--TM-neon-green);
        }

        .header h1 {
            font-family: var(--font-heading);
            font-size: 32px;
            font-weight: 700;
            color: var(--TM-neon-green);
            margin-bottom: var(--spacing-sm);
            letter-spacing: -0.02em;
            line-height: 1.3;
            text-shadow: 0 0 20px rgba(100, 255, 218, 0.3);
        }

        .header p {
            font-size: 16px;
            font-weight: 400;
            color: var(--TM-text-secondary);
            line-height: 1.6;
        }

        .tabs {
            display: flex;
            background: var(--TM-navy-medium);
            border-bottom: 1px solid var(--TM-border-subtle);
            overflow-x: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--TM-neon-green) var(--TM-navy-medium);
        }

        .tabs::-webkit-scrollbar {
            height: 4px;
        }

        .tabs::-webkit-scrollbar-track {
            background: var(--TM-navy-medium);
        }

        .tabs::-webkit-scrollbar-thumb {
            background: var(--TM-neon-green);
            border-radius: 2px;
        }

        .tab {
            padding: 18px 30px;
            cursor: pointer;
            border: none;
            background: transparent;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 600;
            color: var(--TM-text-secondary);
            transition: all 300ms ease-in-out;
            border-bottom: 3px solid transparent;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .tab:hover {
            background: rgba(100, 255, 218, 0.05);
            color: var(--TM-text-primary);
        }

        .tab.active {
            color: var(--TM-neon-green);
            border-bottom-color: var(--TM-neon-green);
            background: rgba(100, 255, 218, 0.08);
        }

        .content {
            padding: var(--spacing-2xl);
        }

        .module-section {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }

        .module-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { 
                opacity: 0; 
                transform: translateY(20px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }

        .module-header {
            background: var(--TM-card-bg);
            border: 1px solid var(--TM-card-border);
            padding: var(--spacing-lg);
            border-radius: 8px;
            margin-bottom: var(--spacing-xl);
        }

        .module-header h2 {
            font-family: var(--font-heading);
            font-size: 24px;
            font-weight: 600;
            color: var(--TM-neon-green);
            margin-bottom: var(--spacing-sm);
            letter-spacing: -0.01em;
            line-height: 1.4;
        }

        .module-header .meta {
            font-size: 14px;
            color: var(--TM-text-secondary);
            line-height: 1.6;
        }

        .module-header .meta strong {
            color: var(--TM-cyan-vibrant);
            font-weight: 600;
        }

        .criteria-category {
            margin-bottom: var(--spacing-xl);
            background: var(--TM-card-bg);
            border-radius: 8px;
            padding: var(--spacing-lg);
            border-left: 4px solid var(--TM-neon-green);
            border: 1px solid var(--TM-card-border);
            border-left: 4px solid var(--TM-neon-green);
        }

        .criteria-category h3 {
            font-family: var(--font-heading);
            color: var(--TM-cyan-vibrant);
            margin-bottom: var(--spacing-md);
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            letter-spacing: -0.01em;
            line-height: 1.4;
        }

        .criteria-category h3::before {
            content: '▶';
            font-size: 12px;
            color: var(--TM-neon-green);
        }

        .criterion {
            background: var(--TM-navy-medium);
            padding: 18px;
            margin-bottom: var(--spacing-md);
            border-radius: 8px;
            display: flex;
            align-items: flex-start;
            gap: var(--spacing-md);
            transition: all 300ms ease-in-out;
            border: 2px solid transparent;
            cursor: pointer;
        }

        .criterion:hover {
            border-color: var(--TM-neon-green);
            box-shadow: 0 0 20px rgba(100, 255, 218, 0.15);
            transform: translateX(5px);
        }

        .criterion input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            margin-top: 2px;
            accent-color: var(--TM-neon-green);
            border-radius: 4px;
        }

        .criterion-text {
            flex: 1;
        }

        .criterion-text strong {
            color: var(--TM-text-emphasis);
            display: block;
            margin-bottom: var(--spacing-xs);
            font-size: 16px;
            font-weight: 600;
            line-height: 1.5;
        }

        .criterion-text p {
            color: var(--TM-text-secondary);
            line-height: 1.6;
            font-size: 14px;
        }

        .progress-section {
            position: sticky;
            top: 20px;
            background: var(--TM-card-bg);
            border: 1px solid var(--TM-card-border);
            padding: var(--spacing-lg);
            border-radius: 8px;
            margin-bottom: var(--spacing-xl);
        }

        .progress-section h3 {
            font-family: var(--font-heading);
            margin-bottom: var(--spacing-md);
            color: var(--TM-neon-green);
            font-size: 18px;
            font-weight: 600;
        }

        .progress-bar {
            height: 30px;
            background: var(--TM-navy-light);
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: var(--spacing-md);
            border: 1px solid var(--TM-border-subtle);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--TM-neon-green) 0%, var(--TM-cyan-vibrant) 100%);
            transition: width 500ms ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--TM-navy-deep);
            font-weight: 700;
            font-size: 14px;
            font-family: var(--font-mono);
            letter-spacing: 0.02em;
        }

        .progress-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--spacing-md);
            margin-top: var(--spacing-md);
        }

        .stat {
            text-align: center;
            padding: var(--spacing-md);
            background: var(--TM-navy-medium);
            border-radius: 8px;
            border: 1px solid var(--TM-border-subtle);
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            font-family: var(--font-heading);
            color: var(--TM-neon-green);
            display: block;
            line-height: 1.3;
            letter-spacing: -0.02em;
        }

        .stat-label {
            font-size: 12px;
            color: var(--TM-text-secondary);
            margin-top: var(--spacing-xs);
            text-transform: uppercase;
            letter-spacing: 0.02em;
            line-height: 1.4;
        }

        .export-btn {
            width: 100%;
            padding: 12px 24px;
            background: var(--TM-neon-green);
            color: var(--TM-navy-deep);
            border: none;
            border-radius: 8px;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 300ms ease-in-out;
            margin-top: var(--spacing-md);
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .export-btn:hover {
            background: var(--TM-cyan-vibrant);
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(100, 255, 218, 0.4);
        }

        .export-btn:focus {
            outline: 2px solid var(--TM-neon-green);
            outline-offset: 2px;
        }

        .notes-section {
            margin-top: var(--spacing-xl);
            padding: var(--spacing-md);
            background: rgba(255, 165, 0, 0.08);
            border-radius: 8px;
            border-left: 4px solid var(--TM-warning);
            border: 1px solid rgba(255, 165, 0, 0.2);
            border-left: 4px solid var(--TM-warning);
        }

        .notes-section h4 {
            font-family: var(--font-heading);
            color: var(--TM-warning);
            margin-bottom: var(--spacing-sm);
            font-size: 16px;
            font-weight: 600;
        }

        .notes-section textarea {
            width: 100%;
            padding: 12px 16px;
            background: var(--TM-input-bg);
            border: 1px solid var(--TM-input-border);
            border-radius: 8px;
            font-family: var(--font-body);
            font-size: 14px;
            color: var(--TM-text-primary);
            resize: vertical;
            min-height: 100px;
            line-height: 1.6;
            transition: all 300ms ease-in-out;
        }

        .notes-section textarea:focus {
            outline: none;
            border-color: var(--TM-neon-green);
            box-shadow: 0 0 0 3px rgba(100, 255, 218, 0.1);
        }

        .notes-section textarea::placeholder {
            color: var(--TM-text-secondary);
        }

        .theme-toggle {
            position: fixed;
            bottom: var(--spacing-lg);
            right: var(--spacing-lg);
            width: 56px;
            height: 56px;
            background: var(--TM-neon-green);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 300ms ease-in-out;
            box-shadow: 0 4px 20px rgba(100, 255, 218, 0.3);
            z-index: 1000;
        }

        .theme-toggle:hover {
            transform: scale(1.1) rotate(15deg);
            box-shadow: 0 6px 30px rgba(100, 255, 218, 0.5);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }
            
            .header p {
                font-size: 14px;
            }
            
            .content {
                padding: var(--spacing-md);
            }
            
            .progress-stats {
                grid-template-columns: 1fr;
            }
            
            .tab {
                padding: 15px 20px;
                font-size: 12px;
            }

            .stat-value {
                font-size: 24px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

        let currentModule = 'levantamentos';
        let checklistState = {};

        function init() {
            loadState();
            renderTabs();
            renderModule(currentModule);
            updateProgress();
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('tabs');
            Object.keys(modules).forEach(key => {
                const btn = document.createElement('button');
                btn.className = 'tab' + (key === currentModule ? ' active' : '');
                btn.textContent = modules[key].name.replace('TMS ', '').replace('Critérios Gerais do ', '');
                btn.onclick = () => switchModule(key);
                btn.setAttribute('aria-label', `Ver módulo ${modules[key].name}`);
                tabsContainer.appendChild(btn);
            });
        }

        function switchModule(moduleKey) {
            currentModule = moduleKey;
            document.querySelectorAll('.tab').forEach((tab, idx) => {
                tab.classList.toggle('active', Object.keys(modules)[idx] === moduleKey);
            });
            renderModule(moduleKey);
            updateProgress();
        }

        function renderModule(moduleKey) {
            const module = modules[moduleKey];
            const container = document.getElementById('moduleContent');
            
            let html = `
                <div class="module-section active">
                    <div class="module-header">
                        <h2>${module.name}</h2>
                        <div class="meta">
                            <strong>Tipo:</strong> ${module.type} | 
                            <strong>Usuário:</strong> ${module.user} | 
                            <strong>Status:</strong> ${module.status}
                        </div>
                    </div>
            `;

            Object.entries(module.categories).forEach(([category, criteria]) => {
                html += `
                    <div class="criteria-category">
                        <h3>${category}</h3>
                `;
                
                criteria.forEach((criterion, idx) => {
                    const id = `${moduleKey}-${category}-${idx}`;
                    const checked = checklistState[id] ? 'checked' : '';
                    html += `
                        <div class="criterion" onclick="toggleCriterion('${id}', event)">
                            <input type="checkbox" id="${id}" ${checked} onclick="event.stopPropagation()" aria-label="${criterion.title}">
                            <div class="criterion-text">
                                <strong>${criterion.title}</strong>
                                <p>${criterion.desc}</p>
                            </div>
                        </div>
                    `;
                });

                html += `</div>`;
            });

            html += `
                    <div class="notes-section">
                        <h4>📝 Observações e Pendências</h4>
                        <textarea id="notes-${moduleKey}" placeholder="Adicione notas sobre este módulo..." aria-label="Notas para ${module.name}">${checklistState[`notes-${moduleKey}`] || ''}</textarea>
                    </div>
                </div>
            `;

            container.innerHTML = html;

            document.getElementById(`notes-${moduleKey}`).addEventListener('input', (e) => {
                checklistState[`notes-${moduleKey}`] = e.target.value;
                saveState();
            });
        }

        function toggleCriterion(id, event) {
            const checkbox = document.getElementById(id);
            if (event.target.type !== 'checkbox') {
                checkbox.checked = !checkbox.checked;
            }
            checklistState[id] = checkbox.checked;
            saveState();
            updateProgress();
        }

        function updateProgress() {
            let total = 0;
            let completed = 0;

            Object.keys(modules).forEach(moduleKey => {
                const module = modules[moduleKey];
                Object.entries(module.categories).forEach(([category, criteria]) => {
                    criteria.forEach((criterion, idx) => {
                        const id = `${moduleKey}-${category}-${idx}`;
                        total++;
                        if (checklistState[id]) completed++;
                    });
                });
            });

            const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;

            document.getElementById('progressFill').style.width = percentage + '%';
            document.getElementById('progressFill').textContent = percentage + '%';
            document.getElementById('completedItems').textContent = completed;
            document.getElementById('totalItems').textContent = total;
            document.getElementById('remainingItems').textContent = total - completed;
        }

        function saveState() {
            localStorage.setItem('maffeng-dod-state', JSON.stringify(checklistState));
        }

        function loadState() {
            const saved = localStorage.getItem('maffeng-dod-state');
            if (saved) {
                checklistState = JSON.parse(saved);
            }
        }

        function exportDoD() {
            let report = `MAFFENG - DEFINITION OF DONE (DoD)
Ecossistema Integrado de Automação Técnica
TMS - Soluções Tecnológicas
Gerado em: ${new Date().toLocaleString('pt-BR')}
${'='.repeat(80)}

`;

            Object.keys(modules).forEach(moduleKey => {
                const module = modules[moduleKey];
                report += `\n${'='.repeat(80)}\n`;
                report += `MÓDULO: ${module.name}\n`;
                report += `${'='.repeat(80)}\n`;
                report += `Tipo: ${module.type}\n`;
                report += `Usuário: ${module.user}\n`;
                report += `Status: ${module.status}\n`;
                report += `${'-'.repeat(80)}\n`;

                let moduleCompleted = 0;
                let moduleTotal = 0;

                Object.entries(module.categories).forEach(([category, criteria]) => {
                    report += `\n▶ ${category}\n`;
                    report += `${'-'.repeat(80)}\n`;
                    
                    criteria.forEach((criterion, idx) => {
                        const id = `${moduleKey}-${category}-${idx}`;
                        const checked = checklistState[id];
                        moduleTotal++;
                        if (checked) moduleCompleted++;
                        
                        report += `${checked ? '[✓]' : '[ ]'} ${criterion.title}\n`;
                        report += `    ${criterion.desc}\n\n`;
                    });
                });

                const modulePercentage = moduleTotal > 0 ? Math.round((moduleCompleted / moduleTotal) * 100) : 0;
                report += `\n${'-'.repeat(80)}\n`;
                report += `PROGRESSO DO MÓDULO: ${moduleCompleted}/${moduleTotal} itens (${modulePercentage}%)\n`;

                const notes = checklistState[`notes-${moduleKey}`];
                if (notes && notes.trim()) {
                    report += `\n📝 OBSERVAÇÕES:\n${'-'.repeat(80)}\n${notes}\n`;
                }
            });

            let totalCompleted = 0;
            let totalItems = 0;
            Object.keys(checklistState).forEach(key => {
                if (!key.startsWith('notes-')) {
                    totalItems++;
                    if (checklistState[key]) totalCompleted++;
                }
            });

            report += `\n\n${'='.repeat(80)}\n`;
            report += `PROGRESSO GERAL DO ECOSSISTEMA MAFFENG\n`;
            report += `${'='.repeat(80)}\n`;
            report += `✓ Itens Concluídos: ${totalCompleted}\n`;
            report += `◯ Itens Totais: ${totalItems}\n`;
            report += `📊 Percentual: ${totalItems > 0 ? Math.round((totalCompleted / totalItems) * 100) : 0}%\n`;
            report += `⏳ Itens Pendentes: ${totalItems - totalCompleted}\n`;
            report += `${'-'.repeat(80)}\n`;
            report += `\nDocumento gerado pelo sistema MAFFENG DoD\n`;
            report += `© ${new Date().getFullYear()} TMS - Soluções Tecnológicas\n`;

            const blob = new Blob([report], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `MAFFENG-DoD-${new Date().toISOString().split('T')[0]}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        init();
    </script>
