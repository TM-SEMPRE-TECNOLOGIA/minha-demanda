<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eval Set Review - __SKILL_NAME_PLACEHOLDER__</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Barlow:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:         #0C0C0F;
      --surface:    #141419;
      --surface-2:  #1C1C24;
      --border:     #28282F;
      --accent:     #FF5E1A;
      --accent-dim: rgba(255,94,26,0.12);
      --text:       #EEEEF2;
      --muted:      #7878A0;
      --green:      #22C55E;
      --green-dim:  rgba(34,197,94,0.10);
      --red:        #EF4444;
      --red-dim:    rgba(239,68,68,0.10);
      --radius:     6px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Barlow', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2rem;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    .page-header {
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    .page-header::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 0;
      width: 60px; height: 1px;
      background: var(--accent);
    }
    .tag {
      font-family: 'Oswald', sans-serif;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }
    h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .description {
      font-size: 13px;
      color: var(--muted);
      max-width: 700px;
    }

    /* ── CONTROLS ── */
    .controls {
      margin-bottom: 1.5rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .btn {
      font-family: 'Oswald', sans-serif;
      padding: 8px 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      background: transparent;
      color: var(--muted);
    }
    .btn:hover {
      background: var(--surface-2);
      color: var(--text);
      border-color: var(--muted);
    }
    .btn-add {
      background: var(--accent-dim);
      color: var(--accent);
      border-color: rgba(255,94,26,0.3);
    }
    .btn-add:hover {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
    .btn-export {
      background: var(--surface-2);
      color: var(--text);
      border-color: var(--border);
    }
    .btn-export:hover {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    /* ── TABLE ── */
    table {
      width: 100%;
      max-width: 1100px;
      border-collapse: collapse;
      background: var(--surface);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    th {
      font-family: 'Oswald', sans-serif;
      background: var(--surface-2);
      color: var(--muted);
      padding: 12px 16px;
      text-align: left;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface-2); }

    .section-header td {
      background: rgba(255,94,26,0.06);
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      font-size: 10px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 2px;
      border-bottom: 1px solid var(--border);
      border-top: 1px solid var(--border);
    }
    .section-header.no-trigger td {
      background: rgba(239,68,68,0.05);
      color: rgba(239,68,68,0.6);
    }

    /* ── QUERY INPUT ── */
    .query-input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
      font-family: 'Barlow', sans-serif;
      resize: vertical;
      min-height: 56px;
      background: var(--bg);
      color: var(--text);
      transition: border-color 0.15s;
    }
    .query-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-dim);
    }

    /* ── TOGGLE ── */
    .toggle {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
      vertical-align: middle;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle .slider {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 22px;
      cursor: pointer;
      transition: 0.2s;
    }
    .toggle .slider::before {
      content: "";
      position: absolute;
      width: 16px; height: 16px;
      left: 3px; bottom: 3px;
      background: var(--muted);
      border-radius: 50%;
      transition: 0.2s;
    }
    .toggle input:checked + .slider {
      background: var(--accent-dim);
      border: 1px solid rgba(255,94,26,0.4);
    }
    .toggle input:checked + .slider::before {
      transform: translateX(18px);
      background: var(--accent);
    }
    .toggle-label {
      margin-left: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      vertical-align: middle;
    }
    .toggle-label.active { color: var(--accent); }

    /* ── DELETE BUTTON ── */
    .btn-delete {
      background: transparent;
      color: var(--red);
      border: 1px solid var(--red-dim);
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Oswald', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: background 0.15s;
    }
    .btn-delete:hover {
      background: var(--red-dim);
    }

    /* ── SUMMARY ── */
    .summary {
      margin-top: 1.25rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--muted);
    }
    .summary .count { color: var(--accent); font-weight: 500; }
  </style>
</head>
<body>
  <div class="page-header">
    <div class="tag">Skill Creator · Eval Review</div>
    <h1>Eval Set Review: <span id="skill-name">__SKILL_NAME_PLACEHOLDER__</span></h1>
    <p class="description">Current description: <span id="skill-desc">__SKILL_DESCRIPTION_PLACEHOLDER__</span></p>
  </div>

  <div class="controls">
    <button class="btn btn-add" onclick="addRow()">+ Add Query</button>
    <button class="btn btn-export" onclick="exportEvalSet()">Export Eval Set</button>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width:65%">Query</th>
        <th style="width:18%">Should Trigger</th>
        <th style="width:10%">Actions</th>
      </tr>
    </thead>
    <tbody id="eval-body"></tbody>
  </table>

  <p class="summary" id="summary"></p>

  <script>
    const EVAL_DATA = __EVAL_DATA_PLACEHOLDER__;

    let evalItems = [...EVAL_DATA];

    function render() {
      const tbody = document.getElementById('eval-body');
      tbody.innerHTML = '';

      const sorted = evalItems
        .map((item, origIdx) => ({ ...item, origIdx }))
        .sort((a, b) => (b.should_trigger ? 1 : 0) - (a.should_trigger ? 1 : 0));

      let lastGroup = null;
      sorted.forEach(item => {
        const group = item.should_trigger ? 'trigger' : 'no-trigger';
        if (group !== lastGroup) {
          const headerRow = document.createElement('tr');
          headerRow.className = `section-header ${group === 'no-trigger' ? 'no-trigger' : ''}`;
          headerRow.innerHTML = `<td colspan="3">${item.should_trigger ? '▶ Should Trigger' : '✕ Should NOT Trigger'}</td>`;
          tbody.appendChild(headerRow);
          lastGroup = group;
        }

        const idx = item.origIdx;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><textarea class="query-input" onchange="updateQuery(${idx}, this.value)">${escapeHtml(item.query)}</textarea></td>
          <td>
            <label class="toggle">
              <input type="checkbox" ${item.should_trigger ? 'checked' : ''} onchange="updateTrigger(${idx}, this.checked)">
              <span class="slider"></span>
            </label>
            <span class="toggle-label ${item.should_trigger ? 'active' : ''}">${item.should_trigger ? 'YES' : 'NO'}</span>
          </td>
          <td><button class="btn-delete" onclick="deleteRow(${idx})">Delete</button></td>
        `;
        tbody.appendChild(tr);
      });
      updateSummary();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function updateQuery(idx, value) { evalItems[idx].query = value; updateSummary(); }
    function updateTrigger(idx, value) { evalItems[idx].should_trigger = value; render(); }
    function deleteRow(idx) { evalItems.splice(idx, 1); render(); }

    function addRow() {
      evalItems.push({ query: '', should_trigger: true });
      render();
      const inputs = document.querySelectorAll('.query-input');
      inputs[inputs.length - 1].focus();
    }

    function updateSummary() {
      const trigger = evalItems.filter(i => i.should_trigger).length;
      const noTrigger = evalItems.filter(i => !i.should_trigger).length;
      document.getElementById('summary').innerHTML =
        `<span class="count">${evalItems.length}</span> queries — <span class="count">${trigger}</span> should trigger · <span class="count">${noTrigger}</span> should not`;
    }

    function exportEvalSet() {
      const valid = evalItems.filter(i => i.query.trim() !== '');
      const data = valid.map(i => ({ query: i.query.trim(), should_trigger: i.should_trigger }));
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'eval_set.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    render();
  </script>
</body>
</html>
